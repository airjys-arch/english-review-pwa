t’s all there is to it. | 온라인으로 양식만 제출하면 된다. 그게 다다.", "You just need to show your passport at the counter. That’s all there is to it. | 카운터에서 여권만 보여주면 된다. 그게 전부다.", "Practice speaking every day. That’s really all there is to it. | 매일 말하기 연습을 해라. 사실 그게 전부다.", "After I quit my job, I suddenly had a lot of time on my hands. | 직장을 그만둔 후 갑자기 시간이 많이 생겼다.", "During the holidays, students usually have more time on their hands. | 방학 동안 학생들은 보통 시간이 더 많다.", "Now that my project is finished, I have some time on my hands. | 프로젝트가 끝나서 이제 시간이 좀 생겼다.", "When the kids are at school, parents often have some time on their hands. | 아이들이 학교에 가면 부모들은 시간이 좀 생긴다.", "Tom was helpful in every way. | 톰은 모든 면에서 도움이 되었다.", "This new phone is better in every way. | 이 새 휴대폰은 모든 면에서 더 좋다.", "She supported me in every way. | 그녀는 모든 면에서 나를 지지해 주었다.", "Traveling alone helped me grow in every way. | 혼자 여행하는 것은 모든 면에서 나를 성장하게 했다.", "Expression Practice Worksheet"], "sources": ["Day2- Freud said, Love and Work(1).pptx", "Day2_스크립트 패턴(1).docx", "Day2_패턴예시(1).docx"]}, {"id": "인턴영어-3", "day": 3, "title": "Use 3–4 patterns to create short dialogues.", "items": [{"en": "I used to play hooky in high school.", "ko": "고등학교 때 가끔 땡땡이를 쳤어요.", "tag": "play hooky"}, {"en": "I used all the miles I'd saved.", "ko": "모아 두었던 마일리지를 다 썼어요.", "tag": "과거완료 I'd saved"}, {"en": "The news hit me like a ton of bricks.", "ko": "그 소식은 엄청난 충격이었어요.", "tag": "a ton of bricks"}, {"en": "The key to success is to have patience.", "ko": "성공의 비결은 인내심이에요.", "tag": "The key to ~ is to ~"}, {"en": "Come rain or shine, I study every day.", "ko": "비가 오든 맑든 매일 공부해요.", "tag": "come rain or shine"}, {"en": "It makes me feel confident.", "ko": "그렇게 하면 자신감이 생겨요.", "tag": "make me feel"}, {"en": "Sort of felt like I was on vacation all the time.", "ko": "항상 휴가를 보내는 것 같은 느낌이었어요.", "tag": "핵심문장"}, {"en": "I used all the money I'd saved and traveled around Europe.", "ko": "모아 둔 돈을 다 써서 유럽을 여행했어요.", "tag": "핵심문장"}, {"en": "The reality hit me like a ton  A surprised me", "The key to N = N의 열쇠/비결/해결책/핵심", "Come rain or shine", "비가 오던지 안 오던지/ 언제든지", "# 녹음하기 #", "BEN: At first, I admit I enjoyed the novelty of it. Sort of felt like I was playing hooky.", "I used all the miles I’d saved and traveled the globe.", "The problem was, no matter where I went, as soon as I got home, the nowhere-to-be thing hit me like a ton of bricks.", "I realized the key to this whole deal was to keep moving.", "Get up, get out of the house, and go somewhere. Anywhere.", "Come rain or shine, I’m at my Starbucks by 7:15.", "Excuse me, mind if we join you here?", "Hey, how are ya?", "Can’t explain it, but it makes me feel part of something.", "Script 응용", "질문형 만들기", "의문사 추가하기", "내용어 바꾸기", "주어 바꾸기", "그때 너는 서울역에 있었니?", "Were you at Seoul station at that time?", "이 의자 가져가도 될까요?", "Mind if I take this chair?", "나는 공부하는게 실증이 나서 땡떙이 치고 자러 갔다.", "I played hooky and went to bed because I was tired of studying.", "너는 마일리지를 여태까지 얼마나 모았니?", "How much miles have you saved?", "1. Play hooky", "Play hooky = 땡땡이 치다 (학교나 회사)", "= ditch class", "= skip class", "Ex) 날씨가 너무 좋아서 우리는 수업을 빼먹고 공원에 갔다.", "We played hooky and went to the park because the weather was so good.", "Ex) 어제 왜 수업을 빼먹었어?", "Why did you ditch class yesterday?", "Ex) 수업 빼먹을 때 주로 뭐해?", " What do you usually do when you skip class?", "2. I used all the miles I’d saved", "과거 보다 더 과거 = had + pp", "Ex) 우리는 우리가 다운로드 해 두었던 영화를 보았다.", "We watched the movie we had downloaded.", "Ex) 내가 만들었던 파이를 그녀가 가져왔다.", "She brought the pie I’d made.", "Ex) 내가 실수 했던 것을 깨달았다.", " I realized that I had made a mistake.", "3. The 명사 or 문장 +feeling/ moment/ thing", "The-nowhere-to be thing  Ben이 만들어낸 말 ", "Ex) 어디에도 속하지 않는 다라는 것이 충격이었다.", " The nowhere-to-be thing hit me like a ton of bricks.", "I had / It was +", "The + 문장 + feeling/ thing/ moment", "Ex) 어디에도 속하지 않는다는 감정", "The nowhere- to- be feeling.", "Ex) 뭔가 잊어 버린 느낌", "The I -forgot -something feeling all day.", "Ex) 내가 여기에 속한 사람이 아닌 것 같은 느낌", "The I-don’t- belong- here feeling.", "4. 충격이다", "shock/ surprise/ hit me (like a ton of bricks)", "Ex) 그 결과가 나를 놀라게 했다. ( 예상 못함)", "That result surprised me.", "수동  I was shocked by that result.", "Ex) 그 소식이 나를 충격에 빠뜨렸다.", "The news shocked me.", "수동  I was shocked by the news.", "Ex) 갑작스러운 전쟁 선포는 전 세계 사람들에게 충격이었다. (hit ~)", "The sudden announcement of war hit people around the world like a ton of bricks.", "Ex) 최근에 무엇이 당신에게 큰 충격으로 다가왔나요?", " What hit you like a ton of bricks recently?", "What happened to you recently?", "What has happened to you recently?", "5. The key to N is to keep moving.", "이 문제의 해결책은 계속 움직이는 것이었어.", "Key : 비결, 핵심, 정답, 열쇠", "Ex) 자신감이 성공에 이르는 열쇠이다.", "Confidence is the key to success.", "Ex) 나는 많은 인내심을 갖는 것이 성공의 열쇠라고 생각한다.", "I think the key to success is to have a lot of patience.", "Ex) 영어를 말하기를 유창하게 하는 비결은 계속 듣는 것이다.", " The key to speaking English fluently is to keep listening.", "체중 감량에 비결은 꾸준히 운동하는 것이다", "The key to losing weight is to keep working out.", "일찍 일어나는 비결은 계속 일찍 잠에 드는 것이다", "The key to getting up early is to keep going to bed early.", "6. Come rain or shine,", "비가 오던지, 안 오던지  무슨 일 이 있어도", "Ex) 무슨 일이 있어도 7시15분까지 스타벅스에 가 있습니다.", " Come rain or shine, I’m at Starbucks by 7:15.", "Ex) 무슨 일이 있어도 이번 주말에 너를 만나러 갈 거야.", "Come rain or shine, I will go (to) see you this weekend.", "Ex) 그는 무슨 일이 있어도 매주 토요일에 테니스를 칩니다.", " Come rain or shine, he plays tennis every Saturday.", "Day 3 Pattern Practice – Story Training", "1. Key Patterns", "The key to ~ was to ~", "Travel Story", "English Study Story", "Funny Story – Diet", "At first, I admit I enjoyed the novelty of it. | 처음에는 그 새로운 느낌을 즐겼다는 것을 인정합니다.", "Sort of felt like I was on vacation all the time. | 마치 항상 휴가를 보내는 것 같은 느낌이었습니다.", "I used all the money I'd saved and traveled around Europe. | 모아 두었던 돈을 다 써서 유럽을 여행했습니다.", "But when I came back home, the reality hit me like a ton of bricks. | 하지만 집에 돌아왔을 때 현실이 큰 충격으로 다가왔습니다.", "I realized the key to happiness was to keep exploring new places. | 행복의 비결은 새로운 곳을 계속 탐험하는 것이라는 걸 깨달았습니다.", "Come rain or shine, I try to go somewhere new every weekend. | 비가 오든 맑든 매주 새로운 곳에 가려고 합니다.", "It makes me feel part of the world. | 그렇게 하면 세상의 일부가 된 느낌이 듭니다.", "At first, I admit I enjoyed the novelty of learning English. | 처음에는 영어를 배우는 새로운 느낌을 즐겼습니다.", "Sort of felt like I was starting a new adventure. | 새로운 모험을 시작하는 것 같은 느낌이었습니다.", "I used all the time I'd saved to study English every day. | 모아 둔 시간을 모두 써서 매일 영어를 공부했습니다.", "But when I took my first speaking test, the difficulty hit me like a ton of bricks. | 첫 스피킹 시험을 봤을 때 어려움이 큰 충격으로 다가왔습니다.", "I realized the key to improving my English was to keep practicing. | 영어 실력을 높이는 비결은 계속 연습하는 것이라는 걸 깨달았습니다.", "Come rain or shine, I study English for at least 30 minutes every day. | 비가 오든 맑든 매일 최소 30분은 영어를 공부합니다.", "It makes me feel confident. | 그렇게 하면 자신감이 생깁니다.", "At first, I admit I enjoyed the novelty of going on a diet. | 처음에는 다이어트를 시작하는 새로운 느낌을 즐겼습니다.", "Sort of felt like I was becoming a healthy person. | 건강한 사람이 되는 것 같은 느낌이었습니다.", "I used all the motivation I'd saved to go to the gym every day. | 모아 둔 의지를 모두 써서 매일 헬스장에 갔습니다.", "But when I saw a chocolate cake, the temptation hit me like a ton of bricks. | 하지만 초콜릿 케이크를 보자 유혹이 큰 충격처럼 다가왔습니다.", "I realized the key to dieting was to avoid bakeries. | 다이어트의 비결은 빵집을 피하는 것이라는 걸 깨달았습니다.", "Come rain or shine, I try not to walk past dessert shops. | 비가 오든 맑든 디저트 가게 앞을 지나가지 않으려고 합니다.", "It makes me feel proud… sometimes. | 가끔은 스스로가 자랑스럽게 느껴집니다.", "Day 3 Pattern Practice (English / Korean)", "1. Play hooky / ditch class / skip class", "2. I used all the ~ I'd saved (Past perfect)", "3. The + phrase + feeling / moment / thing", "4. shock / surprise / hit me like a ton of bricks", "5. The key to N is to V", "6. Come rain or shine", "We played hooky and went to the park because the weather was so good. | 날씨가 너무 좋아서 우리는 수업을 빼먹고 공원에 갔다.", "Why did you ditch class yesterday? | 어제 왜 수업을 빼먹었어?", "What do you usually do when you skip class? | 수업을 빼먹을 때 주로 뭐해?", "Sometimes students skip class to travel. | 어떤 학생들은 여행을 하려고 수업을 빼먹기도 한다.", "He ditched class and went to the beach. | 그는 수업을 빼먹고 해변에 갔다.", "I used to play hooky when I was in high school. | 나는 고등학교 때 가끔 땡땡이를 쳤다.", "I used all the miles I'd saved and traveled the globe. | 나는 모아 두었던 마일리지를 다 써서 세계 여행을 했다.", "We watched the movie we had downloaded. | 우리는 다운로드해 두었던 영화를 봤다.", "She brought the pie I'd made. | 그녀는 내가 만들어 두었던 파이를 가져왔다.", "I spent all the money I'd saved for the trip. | 나는 여행을 위해 모아 둔 돈을 다 썼다.", "He used all the vacation days he'd saved. | 그는 모아 둔 휴가를 다 사용했다.", "They used the photos they had taken during the trip. | 그들은 여행 중 찍어 두었던 사진을 사용했다.", "The nowhere-to-be thing hit me like a ton of bricks. | 어디에도 속하지 않는다는 느낌이 나에게 큰 충격이었다.", "I had the I-forgot-something feeling all day. | 하루 종일 뭔가 잊어버린 느낌이었다.", "Sometimes I get the I-don't-belong-here feeling. | 가끔 내가 여기 속하지 않는 것 같은 느낌이 든다.", "Monday morning is an I-need-coffee moment. | 월요일 아침은 커피가 절실한 순간이다.", "I had the why-did-I-do-that moment yesterday. | 어제 내가 왜 그랬지 하는 순간이 있었다.", "When I saw the bill, it was the I-can’t-believe-this moment. | 계산서를 보고 믿기 힘든 순간이었다.", "That result surprised me. | 그 결과는 나를 놀라게 했다.", "I was shocked by the news. | 나는 그 소식에 충격을 받았다.", "The news shocked me. | 그 소식이 나를 충격에 빠뜨렸다.", "The sudden announcement of war hit people around the world like a ton of bricks. | 갑작스러운 전쟁 선포는 전 세계 사람들에게 큰 충격이었다.", "The hospital bill hit me like a ton of bricks. | 병원비를 보고 큰 충격을 받았다.", "The sudden rent increase shocked many tenants. | 갑작스러운 월세 인상이 많은 세입자들에게 충격을 주었다.", "Confidence is the key to success. | 자신감은 성공의 열쇠이다.", "I think the key to success is to have patience. | 나는 성공의 열쇠는 인내심이라고 생각한다.", "The key to speaking English fluently is to keep listening. | 영어를 유창하게 말하는 비결은 계속 듣는 것이다.", "The key to learning English is to practice every day. | 영어를 배우는 핵심은 매일 연습하는 것이다.", "The key to staying healthy is to exercise regularly. | 건강을 유지하는 비결은 꾸준히 운동하는 것이다.", "The key to happiness is to enjoy small things. | 행복의 비결은 작은 것들을 즐기는 것이다.", "Come rain or shine, I'm at Starbucks by 7:15. | 비가 오든 맑든 나는 7시 15분까지 스타벅스에 있다.", "Come rain or shine, I will go see you this weekend. | 무슨 일이 있어도 이번 주말에 너를 만나러 갈 것이다.", "Come rain or shine, he plays tennis every Saturday. | 그는 무슨 일이 있어도 매주 토요일 테니스를 친다.", "Come rain or shine, I go jogging every morning. | 나는 비가 오든 맑든 매일 아침 조깅을 한다.", "Come rain or shine, she studies English every day. | 그녀는 무슨 일이 있어도 매일 영어를 공부한다.", "Come rain or shine, we meet once a week. | 우리는 무슨 일이 있어도 일주일에 한 번 만난다."], "sources": ["day3_다이얼로그(1).docx", "Day3- The key to this whole deal was to keep moving(1).pptx", "day3_스크립트 패턴(1).docx", "day3_패턴예시(1).docx"]}, {"id": "인턴영어-4", "day": 4, "title": "Dialogue 1 — Travel", "items": [{"en": "Museums, street food, tours — you name it.", "ko": "박물관, 길거리 음식, 투어 — 뭐든 다요.", "tag": "you name it"}, {"en": "Don't get me wrong, I'd love to come.", "ko": "오해하지 마, 나도 가고 싶어.", "tag": "don't get me wrong"}, {"en": "We got lost in the city.", "ko": "도시에서 길을 잃었어요.", "tag": "get + 형용사"}, {"en": "I got the answer wrong.", "ko": "답을 틀렸어요.", "tag": "get + 목적어 + 형용사"}, {"en": "The hotel was better than I expected.", "ko": "호텔이 예상보다 좋았어요.", "tag": "more/better than ~"}, {"en": "She named her cat Coco.", "ko": "고양이 이름을 코코라고 지었어요.", "tag": "name (동사)"}, {"en": "You name it — museums, street food, boat tours.", "ko": "말만 해 — 박물관, 길거리 음식, 보트 투어 다 했어.", "tag": "핵심문장"}, {"en": "Don't get me wrong, it was exhausting too.", "ko": "오해하지 마, 힘들기도 했어.", "tag": "핵심문장"}, {"en": "I walked more than I planned, and I got really tired.", "ko": "계획보다 많이 걸어서 엄청 피곤해졌어.", "tag": "핵심문장"}, {"en": "Trust me, I've tried everything.", "ko": "정말 다 해봤어요.", "tag": "핵심문장"}, {"en": "A: What did you do on your trip? | A: 여행에서 뭐 했어?", "ko": "", "tag": "수업자료"}, {"en": "A: Does this mall have electronics? | A: 이 쇼핑몰에 전자제품 있어?", "ko": "", "tag": "수업자료"}, {"en": "A: How was the exam? | A: 시험 어땠어?", "ko": "", "tag": "수업자료"}, {"en": "A: Why is Tom upset? | A: 톰 왜 속상해해?", "ko": s a nice lady, but I’m not sure she is right for you.", "ko": "", "tag": "수업자료"}, {"en": " Don’t get me wrong, I love you, but I just don’t want to be with you all the time.", "ko": "", "tag": "수업자료"}, {"en": "He got upset at me for not calling him.", "ko": "", "tag": "수업자료"}, {"en": "We got lost in the city because we took the wrong bus.", "ko": "", "tag": "수업자료"}, {"en": " It got dark while we were exploring the city.", "ko": "", "tag": "수업자료"}], "notes": ["Day4 Dialogue Practice (English — Korean)", "Dialogue 1 — Travel", "Dialogue 2 — Shopping", "Dialogue 3 — Exam", "Dialogue 4 — Friendship", "Dialogue 5 — Hobbies", "Dialogue 6 — Naming", "Student Activity — Create Your Own Dialogue", "English | 한국어", "A: What did you do on your trip? | A: 여행에서 뭐 했어?", "B: You name it — museums, street food, boat tours. | B: 말만 해 — 박물관, 길거리 음식, 보트 투어 다 했어", "A: Sounds fun! | A: 재미있었겠다!", "B: Yeah, but don’t get me wrong, it was exhausting too. | B: 응, 근데 오해하지 마, 너무 힘들기도 했어", "A: Really? | A: 정말?", "B: I walked more than I planned, and I got really tired. | B: 계획보다 많이 걸어서 엄청 피곤해졌어", "A: Does this mall have electronics? | A: 이 쇼핑몰에 전자제품 있어?", "B: You name it — phones, laptops, cameras. | B: 말만 해 — 폰, 노트북, 카메라 다 있어", "A: Great! | A: 좋다!", "B: But don’t get me wrong, it’s more expensive than I expected. | B: 근데 오해하지 마, 예상보다 더 비싸", "A: Oh really? | A: 아 정말?", "B: Yeah, I almost got lost trying to find the exit. | B: 출구 찾다가 길 잃을 뻔했어", "A: How was the exam? | A: 시험 어땠어?", "B: It was harder than I thought. | B: 생각보다 더 어려웠어", "A: Oh no. | A: 이런.", "B: I studied a lot, but I still got some questions wrong. | B: 많이 공부했는데도 몇 문제 틀렸어", "A: That happens. | A: 그럴 수 있지", "B: Yeah, but don’t get me wrong, I think I passed. | B: 그래도 오해하지 마, 합격은 할 것 같아", "A: Why is Tom upset? | A: 톰 왜 속상해해?", "B: He got upset because I didn’t call him. | B: 내가 전화 안 해서 화났어", "A: Oh no. | A: 아이고", "B: Don’t get me wrong, I didn’t ignore him on purpose. | B: 오해하지 마, 일부러 무시한 건 아니야", "A: Did you talk to him? | A: 얘기했어?", "B: Not yet, but I’ll fix it. | B: 아직, 하지만 해결할 거야", "A: What do you do on weekends? | A: 주말에 뭐 해?", "B: You name it — hiking, movies, gaming. | B: 말만 해 — 등산, 영화, 게임 다 해", "A: Wow, that’s a lot. | A: 와 많네", "B: Yeah, but I spend more money than I should. | B: 근데 돈을 써야 하는 것보다 더 쓰게 돼", "A: Same here. | A: 나도 그래", "B: And I usually get tired on Monday. | B: 그리고 월요일엔 항상 피곤해", "A: What did you name your dog? | A: 강아지 이름 뭐로 지었어?", "B: I named him Charlie. | B: 찰리라고 지었어", "A: Cute! | A: 귀엽다!", "B: Can you name your favorite dog breed? | B: 좋아하는 견종 하나 말해볼래?", "A: Golden retriever, for sure. | A: 골든 리트리버, 당연하지", "Use 3–4 patterns from the lesson to create your own dialogue. | 수업에서 배운 패턴 3~4개를 사용해 대화를 만들어 보세요.", "Choose a topic (travel, school, shopping, hobbies, etc.). | 주제를 선택하세요 (여행, 학교, 쇼핑, 취미 등).", "Write at least 4–6 lines. | 최소 4~6문장을 작성하세요.", "Practice speaking with your partner. | 짝과 함께 말하기 연습을 하세요.", "Try to make it sound natural and realistic. | 자연스럽고 실제 상황처럼 말해 보세요.", "Intern", "Day4", "Review ", "단어", "More than I could imagine 내가 상상할 수 있었던 것 보다 더", "Name (동사) 이름을 대다", "Take classes 수업을 듣다", "More than I should 내가 해야 하는 것 보다 더", "Quite the contrary 오히려 그 반대로", "The only traveling I do these days 내가 요즘 하는 여행이라곤", "I just know (that) 문장  문장을 그저 알고 있다.", "# 녹음하기 #", "BEN: How do I spend the rest of my days?", "You name it. Golf, books, movies, pinochle.", "Tried yoga, learned to cook, bought some plants, took classes in Mandarin.", "Translation: Trust me, I’ve tried everything.", "And then ,of course, there are the funerals. So many more than I could imagine.", "The only traveling I do these days is out to San Diego to visit my son and his family.", "They are great. I love them to pieces.", "But to be honest, I think I probably relied on them way more than I should. Don’t get me wrong. I’m not an unhappy person. Quite the contrary.", "I just know there’s a hole in my life, and I need to fill it. Soon.", "Script 응용", "질문형 만들기", "의문사 추가하기", "내용어 바꾸기", "주어 바꾸기", "1. You name it.", "말 만해 (다 있어)", "Name – 이름을 대다", "Name A B – A 이름을 B라고 짓다", "Ex) 진, 보드카, 위스키, 맥주- 말씀만 하세요, 제가 가지고 있습니다.", "Gin, vodka, whiskey, beer- you name it, I’ve got it.", "Ex) 말만 해 – 네가 필요하거나, 원하는 건 뭐든지, 내가 처리 할게.", "You name it- anything you need or want, I’ll take care of it.", "Ex) 나는 모든 종류의 음악을 좋아해 : 락, 블루스, 레게, 클래식- 말만해!", "I like all kinds of music : rock, blues, reggae, classical- you name it!", "Ex) 가고 싶은 도시 하나 말 해 줄 수 있어?", "Can you name a city you want to visit?", "Ex) 그녀는 고양이 이름을 코코라고 지었어요.", " She named her cat Coco.", "2. Don’t get me wrong.", "내 말 오해는 하지마. ( me / us 만 자주 씀 or you got him wrong.)", "Ex) 오해하지마, 나도 가고 싶어, 그런데 내일 너무 바빠.", "Don’t get me wrong, I’d love to come, but I’m too busy tomorrow.", "Ex) 오해는 하지마, 그녀는 정말 좋은 여자야, 하지만 나는 그녀가 너에게 맞지 않다고 생각해.", " Don’t get me wrong, I think she’s a nice lady, but I’m not sure she is right for you.", "Ex) 오해는 하지마, 나는 너를 좋아하지만, 항상 함께 있는 걸 원하지 않을 뿐이야.", " Don’t get me wrong, I love you, but I just don’t want to be with you all the time.", "Get 쓰임", "Get+ 형용사/ 분사= ~한 상태가 되다 (become)", "Get upset/ get nervous/get scared/ get old / get dark/ get hungry/ get lost/ get married", "Ex) 그는 내가 전화하지 않아서 나에게 화가 나버렸다.", "He got upset at me for not calling him.", "Ex) 우리는 버스를 잘 못 타서 도시에서 길을 잃었어요.", "We got lost in the city because we took the wrong bus.", "Ex) 도시 구경 중 어두워졌다.", " It got dark while we were exploring the city.", "Get + something + 형용사", "Get it right 제대로 하다", "Get it wrong 틀리다", "Get someone ready", "Get someone upset", "Get someone dunk", "Ex) 제대로 했어?", " Did you get it right?", "Ex) 와인이 그를 취하게 했다.", " The wine got him drunk.", "Ex) 나는 아이들을 학교를 위해 준비 하게 했다.", " I got the kids ready for school.", "3. More than I could imagine/ more than I should / More than I thought", "상상 할 수 있었던 것보다 더 / 해야 하는 것 보다 더/ 생각 했었던 것 보다 더 + than 주어 동사 (예상, 기준, 기대, 의무)", "Ex) 뷰가 상상 할 수 있었던 것 보다 더 아름다웠어.", "The view was more beautiful than I could imagine.", "Ex) (먹어야 하는 것보다) 너무 많이 먹었어.", "I ate more than I should.", "Ex) 콘서트는 내가 생각 했었던 것 보다 훨씬 신났어.", "The concert was more exciting than I thought.", "Exercise more than/ work more than / brighter than / better than/ harder than/ more crowded than / longer than", "Script Pattern Practice (Bilingual)", "Introduction", "This script practices expressing how you spend your time and your honest feelings about it. Key functions include listing activities, emphasizing experience, clarifying misunderstandings, and expressing a sense of something missing.", "Key Patterns in the Script", "How do I spend ~? — ~을 어떻게 보내나요?", "You name it. — 말만 해요 / 다 해봤어요", "Trust me, I’ve tried everything. — 정말 다 해봤어요", "And of course, there is/are ~. — 그리고 물론 ~도 있죠", "The only ~ I do these days is ~. — 요즘 제가 하는 유일한 ~은 ~이에요", "I love them to pieces. — 정말 너무 좋아해요", "But to be honest, ~. — 솔직히 말하면 ~", "Don’t get me wrong. — 오해하지 마세요", "I just know ~. — 그냥 ~라는 걸 알아요", "Travel Version", "Hobby Version", "Work Version", "Student Version", "How do I spend my free time on vacation? | 휴가 때 자유 시간을 어떻게 보내냐고요?", "You name it. Beaches, museums, street food, night markets. | 말만 해요. 해변, 박물관, 길거리 음식, 야시장.", "Went hiking, took a boat tour, tried surfing, learned basic Spanish. | 하이킹도 하고, 보트 투어도 하고, 서핑도 해보고, 기본 스페인어도 배웠어요.", "Trust me, I’ve tried everything. | 정말 다 해봤어요.", "And of course, there are the crowds. Way more than I expected. | 그리고 물론 사람도 많죠. 예상보다 훨씬 많아요.", "The only traveling I do these days is short weekend trips nearby. | 요즘 하는 여행이라곤 근처 주말 여행뿐이에요.", "They’re great. I love them to pieces. | 그래도 좋아요. 정말 너무 좋아해요.", "But to be honest, I think I need a real adventure. | 하지만 솔직히 진짜 모험이 필요해요.", "Don’t get me wrong. I enjoy relaxing trips. | 오해하지 마세요. 느긋한 여행도 좋아해요.", "I just know I want something more exciting. | 그냥 더 신나는 걸 원한다는 걸 알아요.", "How do I spend my weekends? | 주말을 어떻게 보내냐고요?", "You name it. Netflix, gaming, cafes, workouts. | 말만 해요. 넷플릭스, 게임, 카페, 운동.", "Tried painting, learned guitar, joined a book club, started baking. | 그림도 그리고, 기타도 배우고, 독서 모임도 하고, 베이킹도 시작했어요.", "And of course, there’s always housework. | 그리고 물론 집안일도 있죠.", "The only outings I do these days are grocery runs and coffee runs. (make /do) | 요즘 외출이라곤 장 보러 가거나 커피 마시러 가는 것 뿐이에요.", "They’re nice. I love them to pieces. | 그래도 좋아요. 정말 마음에 들어요.", "But to be honest, I think I need something new. | 하지만 솔직히 새로운 게 필요해요.", "Don’t get me wrong. I’m not bored. | 오해하지 마세요. 지루한 건 아니에요.", "I just know I want a bigger challenge. | 그냥 더 큰 도전을 원해요.", "How do I spend my days at work? | 직장에서 하루를 어떻게 보내냐고요?", "You name it. Meetings, emails, reports, presentations. | 말만 해요. 회의, 이메일, 보고서, 발표.", "Took training courses, learned new software, joined projects. | 교육도 받고, 새로운 프로그램도 배우고, 프로젝트에도 참여했어요.", "And of course, there are the deadlines. | 그리고 물론 마감도 있죠.", "The only breaks I get these days are coffee runs. | 요즘 쉬는 시간이라곤 커피 사러 가는 것뿐이에요.", "They’re great. I love them to pieces. | 그래도 좋아요. 정말 좋아해요.", "But to be honest, I think I work too much. | 하지만 솔직히 일을 너무 많이 하는 것 같아요.", "Don’t get me wrong. I like my job. | 오해하지 마세요. 제 일을 좋아해요.", "I just know I need better balance. | 그냥 더 균형이 필요하다는 걸 알아요.", "How do I spend my time as a student? | 학생으로서 시간을 어떻게 보내냐고요?", "You name it. Classes, assignments, group projects, exams. | 말만 해요. 수업, 과제, 조별 과제, 시험.", "Joined clubs, took extra courses, studied abroad online. | 동아리도 하고, 추가 수업도 듣고, 온라인 교환학생도 했어요.", "And of course, there’s the stress. | 그리고 물론 스트레스도 있죠.", "The only fun I have these days is hanging out with friends. | 요즘 즐거움이라곤 친구들과 노는 것뿐이에요.", "They’re great. I love them to pieces. | 정말 좋아요. 너무 소중해요.", "But to be honest, I think I need more free time. | 하지만 솔직히 더 많은 자유 시간이 필요해요.", "Don’t get me wrong. I enjoy studying. | 오해하지 마세요. 공부도 좋아해요.", "I just know I’m exhausted. | 그냥 너무 지쳤다는 걸 알아요.", "Day4 Pattern Practice (English — Korean)", "Pattern 1. You name it", "Pattern 2. Don’t get me wrong", "Pattern 3. Get + adjective / participle", "Pattern 4. Get + object + adjective", "Pattern 5. More than ~", "Pattern 6. name (verb) — 이름을 말하다", "Pattern 7. n  할 거야?", "B: Probably just staying in. Maybe some frozen pasta. | B: 아마 그냥 집에 있을 것 같아. 냉동 파스타나 먹으려고.", "A: I could make a little salad and turn it into a nice dinner for two, like we did that time. | A: 그때 우리 그랬던 것처럼 간단한 샐러드 만들어서 둘이 근사한 저녁으로 해도 좋겠다.", "B: You mean the other night? | B: 저번 그날 밤처럼?", "A: Yeah, like the other day, when we stayed up talking for hours. | A: 응, 저번에 몇 시간 동안 이야기하며 늦게까지 있었던 그날처럼.", "B: Oh wow, that already feels like forever ago. | B: 와, 벌써 엄청 오래전 일처럼 느껴진다.", "A: I know. We really gotta do that again. | A: 그러게. 우리 진짜 또 그렇게 해야 해.", "B: Yeah, like we used to do. | B: 응, 예전에 자주 그랬던 것처럼.", "A: What are you doing tomorrow morning? | A: 내일 아침 뭐 할 거야?", "B: I was just thinking of getting coffee. | B: 그냥 커피 마실까 생각 중이었어.", "A: We could turn it into a little brunch, like we did that time in Shanghai. | A: 상하이에서 그랬던 것처럼 브런치로 이어가도 좋겠다.", "B: Oh yeah, like the other day at Wukang Road. | B: 아 맞다, 우캉루 갔던 그날처럼.", "A: Exactly. | A: 바로 그 느낌.", "B: We really should do that again, like we used to when we traveled together. | B: 같이 여행 다닐 때처럼 우리 또 꼭 그렇게 하자.", "A: What are you doing this afternoon? | A: 오늘 오후에 뭐 해?", "B: Nothing much. | B: 별거 없어.", "A: I could grab some coffee and turn it into a little catch-up, like we did the other day. | A: 저번처럼 커피 마시면서 가볍게 수다 타임 가져도 좋겠다.", "B: Yeah, I miss that. | B: 응, 그거 그립다.", "A: Me too. We should do that again, like we used to do after work. | A: 나도. 퇴근 후에 늘 그랬던 것처럼 또 하자.", "Day 7 Pattern Practice", "1) Turn A into B (~을 …로 바꾸다)", "2) Gotta (= have got to / have to)", "3) Is it okay if ~ ? (~해도 괜찮을까요?)", "4) Take a rain check (다음으로 미루다)", "5) Like we did that time (그때 했던 것처럼 / 지난번처럼)", "💡 수업 포인트", "turn A into B – 아예 다른 걸로 바뀌는 것", "change A to B – 교체/대체 등의 느낌", "bathroom/restroom (미국식) toilet (영국식)", "take a rain check과 비슷한 톤", "(maybe another time. /can we do it another day? let’s reschedule / can we push it back?) 회화에서는 have to보다 gotta가 훨씬 자주 들림 여행회화에서 매우 자주 사용: We gotta go / I gotta check in / We gotta hurry 호텔, 카페, 약 r you are.", "ko": "", "tag": "수업자료"}, {"en": "I wanna be challenged at work.", "ko": "", "tag": "수업자료"}, {"en": " It was challenging to exercise every day.", "ko": "", "tag": "수업자료"}, {"en": " She is trying to figure out the answer.", "ko": "", "tag": "수업자료"}, {"en": "I’m trying to figure out how to put this thing together.", "ko": "", "tag": "수업자료"}, {"en": "A: I don’t think my English is improving much. | A: 내 영어가 많이 늘지 않는 것 같아.", "ko": "", "tag": "수업자료"}, {"en": "B: Really? The more you practice, the better you get. | B: 그래? 연습할수록 더 늘어.", "ko": "", "tag": "수업자료"}, {"en": "A: I guess… but it’s still hard. | A: 음… 그래도 여전히 어려워.", "ko": "", "tag": "수업자료"}, {"en": "B: It might take a bit to figure out. | B: 이해하는 데 시간이 좀 걸릴 수도 있어.", "ko": "", "tag": "수업자료"}, {"en": "B: The more you try to figure things out, the more you improve. | B: 더 해결하려고 할수록 더 실력이 늘어.", "ko": "", "tag": "수업자료"}, {"en": "B: You should challenge yourself to speak more. | B: 더 말해보는 도전을 해봐야 해.", "ko": "", "tag": "수업자료"}, {"en": "A: Yeah, I wanna be challenged. | A: 응, 나도 도전받고 싶어.", "ko": "", "tag": "수업자료"}, {"en": "B: You’ll get there. | B: 결국 해낼 거야.", "ko": "", "tag": "수업자료"}, {"en": "A: I think we’re lost. | A: 우리 길 잃은 것 같아.", "ko": "", "tag": "수업자료"}, {"en": "B: Yeah, I’m trying to figure out where we are. | B: 응, 지금 우리가 어디인지 알아보려고 하고 있어.", "ko": "", "tag": "수업자료"}, {"en": "A: The map is confusing. | A: 지도 너무 헷갈린다.", "ko": "", "tag": "수업자료"}, {"en": "A: What should we do? | A: 우리 뭐 할까?", "ko": "", "tag": "수업자료"}, {"en": "B: The more we travel, the easier it gets. | B: 여행할수록 더 쉬워져.", "ko": "", "tag": "수업자료"}, {"en": "A: Yeah, we’ll get used to it. | A: 응, 익숙해지겠지.", "ko": "", "tag": "수업자료"}, {"en": "A: I want to get better at this. | A: 이거 더 잘하고 싶어.", "ko": "", "tag": "수업자료"}, {"en": "B: The more you push yourself, the more you grow. | B: 스스로 밀어붙일수록 더 성장해.", "ko": "", "tag": "수업자료"}, {"en": "B: It might take a bit to figure out. | B: 이해하는 데 시간이 걸릴 수도 있어.", "ko": "", "tag": "수업자료"}, {"en": "A: Okay osition? | A: 왜 이 직무에 지원했나요?", "B: I wanna be challenged. | B: 도전받고 싶습니다.", "A: I see. | A: 그렇군요.", "B: The more I challenge myself, the more I improve. | B: 스스로 도전할수록 더 성장한다고 생각합니다.", "A: That’s a good mindset. | A: 좋은 생각이네요.", "B: It might take a bit to figure out, but I’ll get there. | B: 익히는 데 시간이 걸릴 수 있지만 결국 해낼 겁니다.", "Day 8 Script Frames (Korean / English)", "Frame 1 — 여행 / 새로운 도시", "Frame 2 — 영어 공부 / 성장", "Frame 3 — 새 직장 / 인터뷰", "Frame 4 — 여행회화 수업용", "한국어 | English", "그래서 지금 이렇게 첫 혼자 여행을 계획하고 있어요. 이 여행을 생각하면 할수록 더 설레는 것 같아요. | So here I am, planning my first solo trip because the more I think about this trip, the more exciting I think it is.", "매일 새로운 도시에서 눈을 뜨는 상상을 정말 좋아해요. | I love the idea of waking up in a new city every day.", "저는 자유로움과 모험을 원해요. 도전받고 싶어요. | I want the freedom, the adventure. I wanna be challenged.", "그리고 어쩌면 놀라운 경험도 하고 싶은 것 같아요. | And I guess I might even wanna be surprised.", "길 찾는 건 조금 시간이 걸릴 수도 있어요. | The directions might take a bit to figure out.", "역이 어디인지 알아보려고 누군가에게 물어봐야 할지도 몰라요. | I might have to ask someone just to find out where the station is.", "그래도 결국 해낼 거예요. 탐험할 준비가 되어 있어요. | But I’ll get there. Eager to explore.", "그리고 저는 원래 새로운 것을 시도하는 걸 좋아해왔다는 것도 알아주셨으면 해요. 저는 호기심이 많고 적응을 잘하며 압박 속에서도 침착해요. | Also I want you to know I’ve always loved trying new things. I’m curious, adaptable, and good under pressure.", "그래서 지금 이렇게 영어를 더 진지하게 배우고 있어요. 이 목표를 생각하면 할수록 더 중요하게 느껴져요. | So here I am, learning English more seriously because the more I think about this goal, the more important I think it is.", "매일 자연스럽게 말할 수 있게 되는 상상이 좋아요. | I love the idea of being able to speak naturally every day.", "저는 자신감과 연결감을 원해요. 도전받고 싶어요. | I want the confidence, the connection. I wanna be challenged.", "그리고 어쩌면 이해받고 싶기도 한 것 같아요. | And I guess I might even wanna be understood.", "문법은 이해하는 데 시간이 좀 걸릴 수도 있어요. | The grammar stuff might take a bit to figure out.", "원어민이 어떻게 말하는지 알아보려고 표현을 다시 확인해야 할 수도 있어요. | I might have to check expressions again just to fin  minutes. | 10분 뒤에 돌아올게요.", "The train leaves in half an hour. | 기차는 30분 뒤에 떠나요.", "I’ll finish the work in two hours. | 두 시간 안에 일 끝낼게요.", "The movie starts in five minutes. | 영화 5분 뒤에 시작해요.", "We’re leaving in an hour. | 한 시간 뒤에 출발해요.", "I’ll call you in a few minutes. | 몇 분 뒤에 전화할게요.", "My class starts in 20 minutes. | 제 수업 20분 뒤에 시작해요.", "The food will be ready in 15 minutes. | 음식은 15분 뒤에 준비돼요.", "She’ll arrive in two days. | 그녀는 이틀 뒤에 도착해요.", "I’m gonna have this fixed today. | 오늘 이거 고치도록 할게요.", "I had my hair cut. | 머리 잘랐어요. (누가 잘라줌)", "Where do you usually have your hair cut? | 보통 어디서 머리 자르세요?", "Tom got his computer repaired. | Tom은 컴퓨터를 수리했어요.", "I need to have my phone checked. | 휴대폰 점검받아야 해요.", "We had the room cleaned. | 방 청소 맡겼어요.", "I’m going to have my car washed. | 차 세차 맡길 거예요.", "She had her nails done yesterday. | 그녀는 어제 네일 받았어요.", "I need to get this printed. | 이거 출력해야 해요.", "We had the package delivered this morning. | 오늘 아침에 택배 배송받았어요.", "Balanced Dialogue Practice", "1. Hotel Check-in Problem", "2. Shopping / Size Exchange", "3. Cafe Order Situation", "4. Presentation File Problem", "A: Hi, I think there’s a problem with my reservation. | 안녕하세요, 제 예약에 문제가 있는 것 같아요.", "B: Okay, let me just review this with you. | 네, 상황 한번 같이 확인해볼게요.", "B: You booked a double room for two nights, right? | 더블룸 2박 예약하셨죠?", "A: Yes, and my trip is in two days. | 네, 그리고 여행이 이틀 뒤예요.", "B: I see. The reservation disappeared from the system somehow. | 확인해보니 예약이 시스템에서 사라졌네요.", "A: Oh no. I was really worried about that. | 어떡하죠. 정말 걱정됐어요.", "B: Here’s what we’re gonna do about this. | 자, 이렇게 처리해드릴게요.", "B: I’m gonna contact the hotel and have this fixed today. | 호텔에 연락해서 오늘 바로 해결할게요.", "A: Thank you. I really appreciate it. | 감사합니다. 정말 감사해요.", "B: I’ll personally check your reservation before you arrive. | 도착 전에 제가 직접 확인할게요.", "A: That makes me feel much better. | 훨씬 안심되네요.", "B: Let me give you my number just in case. | 혹시 모르니까 제 번호 드릴게요.", "A: Perfect. Thank you so much. | 좋아요. 정말 감사합니다.", "B: You can check this off your list now. | 이제 이건 걱정 안 하셔도 돼요.", "A: Hi, I’m looking for this jacket in medium. | 안녕하세요, 이 재킷 M 사이즈 찾고 있어요.", "B: Let me check that for you. | 확인해볼게요.", "B: Actually, the wrong size was delivered this morning. | 사실 오늘 아침 잘못된 사이즈가 배송됐어요.", "A: Really? My event is in three days. | 정말요? 행사 3일 남았는데요.", "B: I totally understand your concern. | 걱정되실 만하네요.", "A: Yeah, I really need it before Friday. | 네, 금요일 전에는 꼭 필요해요.", "B: Okay, here’s what we’re gonna do. | 자, 이렇게 도와드릴게요.", "B: I’m gonna contact the vendor and have this replaced today. | 업체에 연락해서 오늘 바로 교환 처리할게요.", "A: That would be amazing. | 정말 감사하겠네요.", "B: I promise you it’ll arrive by Friday morning. | 금요일 아침까지 도착하게 해드릴게요.", "A: Okay, thank you for helping me out. | 네, 도와주셔서 감사합니다.", "B: We’re also gonna refund your shipping fee. | 배송비도 환불해드릴게요.", "A: Wow, thank you so much. | 와, 정말 감사합니다.", "B: You’re all set now. | 이제 다 처리됐습니다.", "A: Hey, can I get you a drink? | 야, 뭐 마실 거 사다줄까?", "B: Sounds great. | 좋지.", "A: What can I get you? | 뭐 마실래?", "B: Can I get a latte in large? | 라지 라떼 하나 가능할까?", "A: Sure. Anything else? | 물론이지. 또 필요한 거 있어?", "B: Maybe a blueberry muffin too. | 블루베리 머핀도 하나 먹을래.", "A: Got it. It’ll be ready in five minutes. | 알겠어. 5분 뒤에 준비된대.", "B: Nice. I’ll grab us a seat then. | 좋네. 그럼 내가 자리 맡을게.", "A: Sounds good. | 좋아.", "B: Oh wow, they gave us cookies for free. | 와, 쿠키 서비스로 줬네.", "A: Yeah, they said they’re on the house. | 응, 서비스래.", "B: That’s awesome. | 좋다 진짜.", "A: Hi, I think there’s a problem with my presentation file. | 안녕하세요, 발표 파일에 문제가 있는 것 같아요.", "B: Okay, let me just review this with you. | 네, 상황 같이 확인해볼게요.", "B: You submitted the presentation yesterday, right? | 어제 발표 파일 제출하셨죠?", "A: Yes, but now I can’t find it anywhere. | 네, 그런데 지금 파일이 안 보여요.", "B: I see. The meeting is in an hour too. | 그렇군요. 회의도 한 시간 뒤네요.", "A: Yeah, I’m honestly freaking out a little. | 네, 솔직히 좀 멘붕이에요.", "B: Don’t worry. Here’s what we’re gonna do about this. | 걱정 마세요. 이렇게 해결해볼게요.", "B: I’m gonna contact IT and have this recovered immediately. | IT팀에 연락해서 바로 복구 요청할게요.", "A: Thank you. I really needed help. | 감사합니다. 정말 도움이 필요했어요.", "B: I’ll personally check the final version myself. | 최종 파일은 제가 직접 확인할게요.", "A: That makes me feel a lot better. | 훨씬 안심되네요.", "B: I promise you everything will be ready before the meeting. | 회의 전에 다 준비되게 하겠습니다.", "A: Okay, thank you again. | 네, 다시 한번 감사합니다.", "B: This is taken care of. | 처리 완료됐습니다."], "sources": ["Day10 스트립트 패턴(1).docx", "Day10- Let me just review this with you(1).pptx", "Day10 패턴예시(1).docx", "Day10 다이얼로그 패턴(1).docx"]}]}];let ci=0,di=0,mode='',idx=0,list=[],timer=null;const S=JSON.parse(localStorage.getItem('englishReviewV3')||'{"correct":0,"wrong":0,"streak":0,"last":"","wrongs":[]}');
const $=x=>document.getElementById(x);function save(){localStorage.setItem('englishReviewV3',JSON.stringify(S));stats()}function stats(){$('stats').textContent=`🔥 ${S.streak}일 연속 · 정답 ${S.correct} · 오답 ${S.wrong} · 오답노트 ${S.wrongs.length}`}function streak(){let t=new Date().toISOString().slice(0,10);if(S.last!==t){let y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.last===y?S.streak+1:1;S.last=t;save()}}function C(){return DATA[ci]}function D(){return C().days[di]}function esc(s){return(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function cleanEn(s){return norm(s).replace(/\b(x|o)\b/g,' ').replace(/\s+/g,' ').trim()}function sourceMeaning(x){if(x.ko&&x.ko.trim())return x.ko.trim();let notes=D().notes||[],target=cleanEn(x.en);if(!target)return '';for(let i=0;i<notes.length;i++){let n=String(notes[i]||'').trim();if(!n)continue;let parts=n.split('|').map(v=>v.trim());if(parts.length>1){let left=cleanEn(parts[0]);if(left&&(left===target||left.includes(target)||target.includes(left))){let k=parts.slice(1).join(' | ').trim();if(/[가-힣]/.test(k))return k}}let nn=cleanEn(n);if(nn===target&&i+1<notes.length){let nxt=String(notes[i+1]||'').trim();if(/[가-힣]/.test(nxt)&&!/[A-Za-z]{4,}/.test(nxt))return nxt}}return ''}function hintBlock(x,label){let k=sourceMeaning(x);return `<div class="study-hint"><div class="label">${label||'한국어 뜻'}</div><div class="meaning">${esc(k||'수업자료에 한국어 번역이 따로 적혀 있지 않습니다.')}</div><button class="lc-btn" onclick="tts(list[idx].en)">🔊 LC 듣기</button></div>`}
function nav(){$('courses').innerHTML=DATA.map((c,i)=>`<button class="chip ${i===ci?'on':''}" onclick="ci=${i};di=0;home()">${c.name}</button>`).join('');$('days').innerHTML=C().days.map((d,i)=>`<button class="chip ${i===di?'on':''}" onclick="di=${i};home()">Day ${d.day}</button>`).join('')}
function home(){clearInterval(timer);nav();let d=D();$('main').innerHTML=`<div class="card"><div class="title">Day ${d.day} · ${esc(d.title)}</div><div class="sub">연습문장 ${d.items.length}개 · 원본자료 ${d.sources.length}개</div></div><div class="grid"><button class="btn" onclick="start('blank')">✍️ 빈칸 채우기</button><button class="btn" onclick="start('speak')">🎤 말해보기</button><button class="btn" onclick="start('three')">⏱️ 3초 즉답</button><button class="btn" onclick="start('card')">🃏 문장 카드</button><button class="btn alt" onclick="wrongReview()">📌 오답 복습</button><button class="btn alt" onclick="notes()">📚 수업자료</button></div>`}
function valid(){return D().items.filter(x=>x.en&&x.en.length<240)}function start(m,custom){mode=m;idx=0;list=custom||valid();if(!list.length)return alert('연습 문장이 없습니다.');render()}function blankify(s){let w=s.split(/\s+/),n=Math.max(1,Math.floor(w.length/3)),ids=[];while(ids.length<n){let x=Math.floor(Math.random()*w.length);if(!ids.includes(x)&&/[A-Za-z]/.test(w[x]))ids.push(x)}return w.map((x,i)=>ids.includes(i)?'____':x).join(' ')}
function tts(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.88;speechSynthesis.speak(u)}function norm(s){return(s||'').toLowerCase().replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}function sim(a,b){let A=norm(a).split(' ').filter(Boolean),B=norm(b).split(' ').filter(Boolean),hit=A.filter(x=>B.includes(x)).length;return Math.round(100*2*hit/Math.max(1,A.length+B.length))}function mark(ok,x){ok?S.correct++:S.wrong++;if(!ok&&!S.wrongs.some(w=>w.en===x.en))S.wrongs.push({...x,course:C().name,day:D().day});save()}
function render(){clearInterval(timer);let x=list[idx],meaning=sourceMeaning(x),prompt=mode==='blank'?blankify(x.en):mode==='card'?x.en:(meaning||'한국어 뜻이 원본 자료에 별도로 적혀 있지 않습니다.');let showHint=(mode==='blank'||mode==='speak'||mode==='three');$('main').innerHTML=`<div class="progress"><i style="width:${(idx+1)/list.length*100}%"></i></div><div class="card"><div class="sub">${idx+1}/${list.length} · ${esc(x.tag||'수업자료')}</div>${mode==='three'?'<div class="timer" id="tm">3</div>':''}${showHint?hintBlock(x,mode==='blank'?'한국어 뜻 · 빈칸 힌트':'한국어 뜻'):''}<div class="q">${esc(prompt)}</div><div id="answer" class="ko ${mode==='card'?'':'hide'}">${esc(meaning||'수업자료에 한국어 번역 미수록')}<br><b>${esc(x.en)}</b></div>${mode==='blank'?'<input id="inp" class="input" placeholder="문장 전체를 입력하세요">':''}<div id="heard" class="heard"></div><div id="score" class="score"></div></div><div class="row">${mode==='blank'?'<button class="btn" onclick="checkBlank()">정답 확인 + LC</button>':'<button class="btn" onclick="listen()">🎤 말하기</button>'}<button class="btn alt" onclick="tts(list[idx].en)">🔊 LC</button><button class="btn alt" onclick="reveal()">정답 보기</button></div><div class="row" style="margin-top:8px"><button class="btn alt" onclick="prev()">← 이전</button><button class="btn" onclick="next()">다음 →</button></div>`;if(mode==='card')tts(x.en);if(mode==='three'){let n=3;timer=setInterval(()=>{n--;let e=$('tm');if(e)e.textContent=n>0?n:'말해!';if(n<=0)clearInterval(timer)},1000)}}
function reveal(){$('answer').classList.remove('hide');tts(list[idx].en)}function checkBlank(){let x=list[idx],p=sim($('inp').value,x.en);$('score').textContent=p>=85?`${p}점 · 정답! 전체 문장을 들어보세요 🔊`:`${p}점 · 정답을 확인하고 전체 문장을 들어보세요 🔊`;mark(p>=85,x);$('answer').classList.remove('hide');setTimeout(()=>tts(x.en),250)}function listen(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('이 기기/브라우저에서는 음성인식이 제한될 수 있습니다. 정답 듣기 후 따라 말하기를 사용하세요.');return}let r=new SR();r.lang='en-US';r.interimResults=false;$('heard').textContent='듣고 있어요…';r.onresult=e=>{let t=e.results[0][0].transcript,p=sim(t,list[idx].en);$('heard').textContent=`인식: ${t}`;$('score').textContent=`${p}점`;mark(p>=80,list[idx]);if(p>=80)$('answer').classList.remove('hide')};r.onerror=()=>$('heard').textContent='인식 실패. 다시 눌러보세요.';r.start()}function next(){idx=(idx+1)%list.length;render()}function prev(){idx=(idx-1+list.length)%list.length;render()}
function notes(){let d=D();$('main').innerHTML=`<div class="card"><div class="title">Day ${d.day} 수업자료</div><div class="sub">${d.sources.map(esc).join(' · ')}</div></div><div class="card notes">${d.notes.map(esc).join('\n')}</div><button class="btn alt" onclick="home()">← 홈</button>`}function wrongReview(){let w=S.wrongs.filter(x=>x.course===C().name);if(!w.length)return alert('이 과정의 오답이 아직 없습니다.');start('speak',w)}streak();home();
</script><script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW registration failed:', err));
  });
}
</script></body></html>
